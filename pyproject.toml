[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exosearch-ai"
version = "0.1.0"
description = "Leakage-aware TESS TOI candidate classification and ranking research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Fatima Humbatova"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.5,<2",
  "xgboost>=2.0,<4", "matplotlib>=3.8,<4", "plotly>=5.20,<7",
  "jinja2>=3.1,<4", "requests>=2.31,<3", "joblib>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
exosearch = "exosearch_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
exosearch_ai = ["templates/*.html"]
