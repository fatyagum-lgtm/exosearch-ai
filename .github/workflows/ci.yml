name: ExoSearch Research Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OpenMP on macOS (XGBoost runtime)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: python -m pytest
      - name: Ruff lint
        run: ruff check .
      - name: CLI help
        run: exosearch --help
      - name: Validate synthetic demo end to end
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: exosearch demo --output /tmp/exosearch-ci-demo --stars 120
